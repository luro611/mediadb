# Mac (OrbStack/Docker Desktop): Musik von externen Laufwerken und aus dem Benutzerordner lesbar.
# Für Proxmox/Linux siehe docker-compose.homelab.yml und docs/BETRIEB.md.
services:
  mediadb:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST_HOME=${HOME}
    volumes:
      - ./data:/app/data
      - /Volumes:/host/volumes:ro
      - ${HOME}:/host/home:ro
    restart: unless-stopped
