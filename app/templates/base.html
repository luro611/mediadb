<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>try{const t=localStorage.getItem("musikdb-theme");if(t)document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}</script><link rel="stylesheet" href="/static/style.css?v={{ asset_v }}"><title>MusikDB</title></head><body><div class="shell"><nav><a class="brand" href="/">Musik<em>DB</em></a><a href="/media">Sammlung</a><a href="/add">Hinzufügen</a><button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Farbschema wechseln">◐ <span>Theme</span></button></nav><main>{% block content %}{% endblock %}</main></div><script>function toggleTheme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('musikdb-theme',n)}</script></body></html>
