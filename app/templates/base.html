<!doctype html><html lang="{{ lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>try{const t=localStorage.getItem("musikdb-theme");if(t)document.documentElement.dataset.theme=t;else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.dataset.theme="dark"}catch(e){}</script><link rel="stylesheet" href="/static/style.css?v={{ asset_v }}"><title>MusikDB</title></head><body><div class="shell"><nav><a class="brand" href="/">Musik<em>DB</em></a><a href="/media">{{ _("Sammlung") }}</a><a href="/add">{{ _("Hinzufügen") }}</a><button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="{{ _('Farbschema wechseln') }}">◐ <span>{{ _("Theme") }}</span></button><div class="lang-switch" role="group" aria-label="{{ _('Sprache') }}">{% for code,name in langs.items() %}<button type="button" class="lang-btn{% if code==lang %} active{% endif %}" title="{{ name }}" aria-pressed="{{ 'true' if code==lang else 'false' }}" onclick="location.href='/lang/{{ code }}?next='+encodeURIComponent(location.pathname+location.search)">{{ code|upper }}</button>{% endfor %}</div></nav><main>{% block content %}{% endblock %}</main></div><script>function toggleTheme(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;localStorage.setItem('musikdb-theme',n)}</script></body></html>
