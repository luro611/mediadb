<div class="tabs films-nav">{% for key,label in view_names.items() %}<a class="tab{% if view==key and not list_id and not coll and active!='collections' and active!='lists' %} active{% endif %}" href="{{ base }}/films{{ '?view='~key if key!='all' else '' }}">{{ _(label) }} <span class="n">{{ counts[key] }}</span></a>{% endfor %}<a class="tab{% if coll or active=='collections' %} active{% endif %}" href="{{ base }}/films/collections">{{ _("Filmreihen") }}</a><a class="tab{% if list_id or active=='lists' %} active{% endif %}" href="{{ base }}/films/lists">{{ _("Eigene Listen") }}</a></div>
